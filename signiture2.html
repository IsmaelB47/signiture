
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Premium Email Signature</title>
</head>
<body style="margin:0;padding:20px;background:#ffffff;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0"
       style="width:100%;max-width:520px;font-family:Arial,Helvetica,sans-serif;
              border-collapse:collapse;color:#252525;">
  <tr>
    <!-- Monogram -->
    <td width="92" valign="top" style="padding:8px 20px 8px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="72" height="72" align="center" valign="middle"
              style="width:72px;height:72px;border:2px solid #B89555;
                     border-radius:50%;font-size:23px;font-weight:bold;
                     color:#B89555;">
            AM
          </td>
        </tr>
      </table>
    </td>

    <!-- Gold divider -->
    <td width="2" bgcolor="#B89555"
        style="width:2px;background:#B89555;font-size:1px;">
      &nbsp;
    </td>

    <!-- Contact details -->
    <td valign="top" style="padding:4px 0 4px 20px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">

        <tr>
          <td style="font-size:23px;line-height:29px;font-weight:bold;
                     letter-spacing:0.2px;color:#252525;">
            Alex Morgan
          </td>
        </tr>

        <tr>
          <td style="padding-top:2px;font-size:11px;line-height:18px;
                     color:#B89555;font-weight:bold;letter-spacing:2px;">
            SENIOR CONSULTANT
          </td>
        </tr>

        <tr>
          <td style="padding-top:4px;padding-bottom:12px;
                     font-size:11px;line-height:17px;
                     color:#777777;letter-spacing:1.5px;">
            ATLAS &amp; CO.
          </td>
        </tr>

        <tr>
          <td style="font-size:12px;line-height:23px;color:#444444;">
            <span style="color:#B89555;font-weight:bold;">Telephone</span>
            &nbsp;
            <a href="tel:+15552347890"
               style="color:#444444;text-decoration:none;">
              +1 (555) 234-7890
            </a>
          </td>
        </tr>

        <tr>
          <td style="font-size:12px;line-height:23px;color:#444444;">
            <span style="color:#B89555;font-weight:bold;">Email</span>
            &nbsp;
            <a href="mailto:alex@atlas-example.com"
               style="color:#444444;text-decoration:none;">
              alex@atlas-example.com
            </a>
          </td>
        </tr>

        <tr>
          <td style="font-size:12px;line-height:23px;color:#444444;">
            <span style="color:#B89555;font-weight:bold;">Website</span>
            &nbsp;
            <a href="https://atlas-example.com"
               style="color:#444444;text-decoration:none;">
              atlas-example.com
            </a>
          </td>
        </tr>

        <tr>
          <td style="padding-top:12px;font-size:11px;line-height:20px;">
            <a href="https://www.linkedin.com/"
               style="color:#B89555;font-weight:bold;
                      text-decoration:none;">
              LinkedIn
            </a>
            <span style="color:#CCCCCC;"> &nbsp;|&nbsp; </span>
            <a href="https://atlas-example.com"
               style="color:#B89555;font-weight:bold;
                      text-decoration:none;">
              Website
            </a>
          </td>
        </tr>

      </table>
    </td>
  </tr>

  <tr>
    <td colspan="3" style="padding-top:17px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"
             width="100%">
        <tr>
          <td height="1" bgcolor="#E7E2D8"
              style="height:1px;background:#E7E2D8;font-size:1px;">
            &nbsp;
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td colspan="3"
        style="padding-top:10px;font-size:10px;line-height:16px;
               color:#888888;letter-spacing:0.5px;">
      CLARITY. STRATEGY. RESULTS.
    </td>
  </tr>
</table>

</body>
</html>
