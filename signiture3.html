
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Executive Email Signature</title>
</head>
<body style="margin:0;padding:16px;background:#ffffff;">

<table role="presentation" cellpadding="0" cellspacing="0" border="0"
       width="500"
       style="width:100%;max-width:500px;border-collapse:collapse;
              font-family:Arial,Helvetica,sans-serif;">

  <tr>
    <!-- BRAND PANEL -->
    <td width="205" valign="middle" bgcolor="#18352F"
        style="width:205px;background-color:#18352F;

      <table role="presentation" cellpadding="0" cellspacing="0"
             border="0">

        <tr>
          <td width="45" height="45" align="center" valign="middle"
              style="width:45px;height:45px;border:1px solid #A8C8B8;
                     color:#FFFFFF;font-family:Georgia,serif;
                     font-size:18px;line-height:45px;font-weight:bold;">
            JD
          </td>
        </tr>

        <tr>
          <td style="padding-top:17px;font-size:22px;line-height:27px;
                     color:#FFFFFF;font-weight:bold;">
            Jordan Davis
          </td>
        </tr>

        <tr>
          <td style="padding-top:5px;font-size:10px;line-height:17px;

            BUSINESS CONSULTANT
          </td>
        </tr>

        <tr>
          <td style="padding-top:14px;font-size:10px;line-height:16px;
                     color:#FFFFFF;font-weight:bold;letter-spacing:1.5px;">
            NORTHLINE GROUP
          </td>
        </tr>

        <tr>
          <td style="padding-top:5px;font-size:10px;line-height:15px;
                     color:#C2D8CD;">
            Strategy. People. Growth.
          </td>
        </tr>

      </table>
    </td>

    <!-- CONTACT PANEL -->
    <td valign="middle" bgcolor="#F6F8F6"

      <table role="presentation" cellpadding="0" cellspacing="0"
             border="0" width="100%">

        <tr>

        </tr>

        <tr>
          <td style="font-size:9px;line-height:14px;color:#7B8C84;
                     font-weight:bold;letter-spacing:1px;">
            EMAIL
          </td>
        </tr>

        <tr>
          <td style="font-size:11px;line-height:19px;
                     padding-bottom:9px;">
            <a href="mailto:jordan@northline.com"
               style="color:#263B35;text-decoration:none;">
              jordan@northline.com
            </a>
          </td>
        </tr>

        <tr>
          <td style="font-size:9px;line-height:14px;color:#7B8C84;
                     font-weight:bold;letter-spacing:1px;">
            PHONE
          </td>
        </tr>

        <tr>
          <td style="font-size:11px;line-height:19px;
                     padding-bottom:9px;">
            <a href="tel:+15551234567"
               style="color:#263B35;text-decoration:none;">
              +1 555 123 4567
            </a>
          </td>
        </tr>

        <tr>
          <td style="font-size:9px;line-height:14px;color:#7B8C84;
                     font-weight:bold;letter-spacing:1px;">
            WEBSITE
          </td>
        </tr>

        <tr>
          <td style="font-size:11px;line-height:19px;
                     padding-bottom:14px;">
            <a href="https://example.com"
               style="color:#263B35;text-decoration:none;">
              northline.com
            </a>
          </td>
        </tr>

        <!-- CTA -->
        <tr>
          <td>
            <table role="presentation" cellpadding="0" cellspacing="0"
                   border="0">
              <tr>
                <td bgcolor="#DCEBE3"
                    style="background-color:#DCEBE3;padding:9px 11px;">
                  <a href="https://example.com"
                     style="font-size:10px;line-height:14px;
                            color:#18352F;font-weight:bold;
                            text-decoration:none;white-space:nowrap;">
                    VISIT WEBSITE &rarr;

              </tr>
            </table>

  <tr>
    <td colspan="2" style="padding-top:10px;">
      <table role="presentation" cellpadding="0" cellspacing="0"
             border="0" width="100%">
        <tr>
