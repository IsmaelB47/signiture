
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Email Signature</title>
</head>
<body style="margin:0;padding:20px;background:#ffffff;">

  <!-- Professional Email Signature -->
  <table role="presentation"
         cellpadding="0"
         cellspacing="0"
         border="0"
         style="width:100%;max-width:480px;
                font-family:Arial,Helvetica,sans-serif;
                color:#263746;border-collapse:collapse;">

    <tr>
      <!-- Logo / Initials -->
      <td width="94" valign="top"
          style="padding:5px 18px 5px 0;
                 border-right:3px solid #2785A8;">

        <table role="presentation" cellpadding="0"
               cellspacing="0" border="0">
          <tr>
            <td width="76" height="76" align="center"
                valign="middle"
                bgcolor="#173B57"
                style="width:76px;height:76px;
                       background:#173B57;
                       color:#ffffff;font-size:25px;
                       font-weight:bold;">
              JD
            </td>
          </tr>
        </table>

      </td>

      <!-- Contact Information -->
      <td valign="top" style="padding:3px 0 3px 18px;">

        <table role="presentation" cellpadding="0"
               cellspacing="0" border="0">

          <tr>
            <td style="font-size:21px;line-height:27px;
                       font-weight:bold;color:#173B57;
                       padding-bottom:2px;">
              John Davis
            </td>
          </tr>

          <tr>
            <td style="font-size:13px;line-height:20px;
                       color:#2785A8;font-weight:bold;">
              Marketing Director
            </td>
          </tr>

          <tr>
            <td style="font-size:11px;line-height:18px;
                       color:#667784;letter-spacing:1px;
                       padding-bottom:10px;">
              NORTHSTAR CREATIVE
            </td>
          </tr>

          <tr>
            <td style="font-size:12px;line-height:21px;">
              <span style="color:#2785A8;font-weight:bold;">
                Telephone:
              </span>
              <a href="tel:+15551234567"
                 style="color:#263746;text-decoration:none;">
                +1 (555) 123-4567
              </a>
            </td>
          </tr>

          <tr>
            <td style="font-size:12px;line-height:21px;">
              <span style="color:#2785A8;font-weight:bold;">
                Email:
              </span>
              <a href="mailto:john@example.com"
                 style="color:#263746;text-decoration:none;">
                john@example.com
              </a>
            </td>
          </tr>

          <tr>
            <td style="font-size:12px;line-height:21px;">
              <span style="color:#2785A8;font-weight:bold;">
                Website:
              </span>
              <a href="https://www.example.com"
                 style="color:#263746;text-decoration:none;">
                www.example.com
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding-top:9px;font-size:12px;
                       line-height:20px;">
              <a href="https://www.linkedin.com/"
                 style="color:#2785A8;font-weight:bold;
                        text-decoration:none;">
                LinkedIn
              </a>

              <span style="color:#AAB6BF;"> &nbsp;|&nbsp; </span>

              <a href="https://www.example.com"
                 style="color:#2785A8;font-weight:bold;
                        text-decoration:none;">
                Website
              </a>
            </td>
          </tr>

        </table>

      </td>
    </tr>

    <tr>
      <td colspan="2"
          style="padding-top:13px;font-size:10px;
                 line-height:16px;color:#87949D;">
        Professional service. Personal attention.
      </td>
    </tr>

  </table>

</body>
</html>
